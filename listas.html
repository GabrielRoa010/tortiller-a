<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
       background-color: coral;
       margin: 20px;
    }
    h1{
        text-align: center;
        color: black;
    }
    h2{
        text-align: center;
        color: rgb(0, 0, 0);
    }
    .contenedor{
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        max-width: 1000px;
        margin: auto;
    }
    .card{
        background-color:azure;
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 4px 8px #cccccc;
        transition: 0.3s;
    }
    .card img{
        width: 65%;
        height: 65%;
        border-radius: 8px;
    }
    .card p{
        color:black;
        font-size: 12px;
    }
</style>
<body>
    <h1>LISTA DE PRECIOS</h1>
    <br>
        <div class="contenedor">
        <div class="card">
            <img src="img/1torti.jpeg">
            <h2>Una Tortilla</h2>
            <p>$1 </p>
        </div>
            <div class="card">
            <img src="img/torti.jpeg">
            <h2>1KL de Tortilla</h2>
            <p>$22 compra los que gustes</p>
        </div>
        <div class="card">
        <img src="img/masa.jpeg">
            <h2>1KL de Masa</h2>
            <p>$17 los que gustes comprar</p>
        </div>
        <div class="card">
            <img src="img/nixta.jpeg">
            <h2>Cubeta de nixtamal</h2>
            <p>$24 la molida</p>
        </div>
        <div class="card">
            <img src="img/toto.jpeg">
            <h2>Totopos</h2>
            <p>$30</p>
        </div>
        <div class="card">
            <img src="img/costa.jpeg">
            <h2>Costadas</h2>
            <p>$25</p>
        </div>
    </div>
</body>
</html>
